    - !append AttackModifier.ThermalAlliedDamage
    - !append AttackModifier.ChemicalAlliedDamage
    - !append AttackModifier.EnemyDamage
    - !append AttackModifier.PhysicalEnemyDamage
    - !append AttackModifier.ThermalEnemyDamage
    - !append AttackModifier.WeaponArmorPenetrationVeryHigh
