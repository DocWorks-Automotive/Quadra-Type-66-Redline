  velocity: 80 #-1
  hitFlags: []
  staminaCost:
    - Attacks.Bullet_Projectile_inline0
    - Attacks.Bullet_Projectile_inline1
    - Attacks.Bullet_Projectile_inline2
    - Attacks.Bullet_Projectile_inline3
    - Attacks.Bullet_Projectile_inline4
